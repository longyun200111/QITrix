[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "QITrix"
version = "0.2.0"
description = "Finite-dimensional quantum information utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.8.2",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
]

[tool.setuptools.packages.find]
include = ["QITrix*"]
